# Minimal HTTP reverse proxy for the ProNestheus stack.
#
# Every web container is reached through this single published port:
#   /              -> landing page linking to the services below
#   /grafana/      -> Grafana dashboards
#   /prometheus/   -> Prometheus UI
#   /pronestheus   -> ProNestheus exporter metrics
#
# HTTPS is intentionally not configured yet; this iteration is plain HTTP.
#
# DHI's nginx runtime image runs as nonroot (65532), so there is no `user`
# directive (a nonroot master cannot setuid). We listen on 80; the Compose
# service sets `net.ipv4.ip_unprivileged_port_start=0` so the nonroot process
# can bind it.

worker_processes auto;

error_log /var/log/nginx/error.log notice;
# DHI chowns /run/nginx to 65532; /var/run is root-owned.
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS. Pairing a resolver with variables in proxy_pass
    # makes nginx re-resolve upstream names per request instead of only once at
    # startup, so it still starts when a container has no running task yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Don't advertise the exact nginx version.
    server_tokens off;

    # Emit relative redirects. nginx only sees its internal listen port (80),
    # so an absolute redirect would ignore the host-side PRONESTHEUS_WEB_PORT
    # mapping. Relative redirects resolve against the browser's current URL.
    absolute_redirect off;

    # Slowloris / slow-body mitigation.
    client_header_timeout 12s;
    client_body_timeout 12s;
    send_timeout          10s;

    # Cheap response hardening, inherited by proxied responses too.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Keep WebSocket connections upgraded (e.g. Grafana Live), close plain HTTP.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen      80 default_server;
        listen [::]:80 default_server;

        # Landing page linking to every service behind this port.
        root /usr/share/nginx/html;
        index index.html;

        location = / {
            try_files /index.html =404;
        }

        # Grafana is provisioned to serve from this sub-path
        # (GF_SERVER_SERVE_FROM_SUB_PATH), so the prefix is passed through.
        location /grafana/ {
            set $grafana grafana;
            proxy_pass http://$grafana:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Prometheus runs with --web.route-prefix=/prometheus/, so the prefix is
        # passed through unchanged.
        location /prometheus/ {
            set $prometheus prometheus;
            proxy_pass http://$prometheus:9090;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Convenience endpoint for the exporter's metrics. Prometheus itself
        # scrapes pronestheus:9777/metrics directly over the Compose network, so
        # this is purely for humans: it maps the friendly /pronestheus path onto
        # the exporter's /metrics endpoint.
        location = /pronestheus {
            set $pronestheus pronestheus;
            proxy_pass http://$pronestheus:9777/metrics;
            proxy_set_header Host $host;
        }
    }
}
