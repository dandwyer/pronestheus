global:
  scrape_interval:     60s

scrape_configs:
  - job_name: prometheus
    # Prometheus serves from /prometheus/ (--web.route-prefix), which also moves
    # its own metrics endpoint to /prometheus/metrics.
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ['localhost:9090']

  - job_name: pronestheus
    static_configs:
      - targets: ['pronestheus:9777']
    