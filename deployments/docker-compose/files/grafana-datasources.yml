# https://grafana.com/docs/grafana/latest/administration/provisioning/#data-sources
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # Prometheus runs with --web.route-prefix=/prometheus/, so its API lives
    # under that prefix as well.
    url: http://prometheus:9090/prometheus/
    isDefault: true
