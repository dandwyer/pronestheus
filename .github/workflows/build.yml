name: build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        go: [stable]
        os:
            - macos-26-intel
            - macos-latest
            - ubuntu-24.04-arm
            - ubuntu-26.04-arm
            - ubuntu-latest
            - windows-latest
    name: Build and Test
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Build
        # CGO_ENABLED=0 produces a static binary for the distroless base image.
        # GOOS/GOARCH cross-compile for each target platform.
        run: go build -ldflags="-s -w" -o pronestheus ./cmd/pronestheus/main.go

      - name: Test
        # Tests must execute natively, so only run them on the host arch (amd64).
        run: go test ./... -v
